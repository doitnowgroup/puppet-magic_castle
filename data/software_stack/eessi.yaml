profile::software_stack::initial_profile: "/cvmfs/software.eessi.io/versions/2023.06/init/Magic_Castle/bash"
profile::software_stack::lmod_default_modules:
  - GCC

# Site-wide EESSI host_injections: where /cvmfs/software.eessi.io/host_injections
# points on every node. Putting it on shared storage means the site installs
# (CUDA/cuDNN SDK, the 2023.06 layout, site MPI overrides) happen once per
# architecture instead of once per node. Deliberately a DIFFERENT path from
# lib_symlink_path below: host driver libraries stay node-local.
# The directory must exist before any node uses it, with a group that grants
# write access to the users who run install_cuda_and_libraries.sh (that script
# must NOT run as root).
# www.eessi.io/docs/site_specific_config/host_injections/
profile::software_stack::eessi_host_injections: '/project/eessi'

# GPU support: symlink the NVIDIA driver libraries installed by profile::gpu
# into the directory that EESSI_NVIDIA_OVERRIDE_DEFAULT points to (see
# profile::software_stack). EESSI >= 2025.06 finds the host drivers there
# through the compat layer variant symlink .../compat/<os>/<arch>/lib/nvidia.
# Node-local on purpose: driver versions may differ per node type.
# www.eessi.io/docs/site_specific_config/gpu/
profile::gpu::install::lib_symlink_path: '/opt/eessi/nvidia'

jupyterhub::kernel::venv::python: /cvmfs/software.eessi.io/versions/2023.06/init/Magic_Castle/eessi_python3
jupyterhub::kernel::venv::prefix: /opt/ipython-kernel-eessi

jupyterhub::jupyterhub_config_hash:
  SlurmFormSpawner:
    ui_args:
      rstudio:
        modules: ['RStudio-Server']
      code-server:
        modules: ['code-server']
